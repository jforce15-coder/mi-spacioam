<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Spacio AM</title>
  <meta property="og:site_name" content="Spacio AM">
  <meta property="og:title" content="Spacio AM">
  <meta property="og:description" content="Abre tu enlace de Spacio AM.">
  <!-- Enlaces cortos (Hub #488 · T5): GitHub Pages muestra esta página para cualquier dirección que no existe.
       Si la dirección es mi.spacioam.com/<código de 5>, se pregunta el enlace largo al Apps Script de Mi
       (acción pública «enlace») y se abre. Las rutas de siempre (index.html, ?…, #…) no pasan por aquí.
       Sin sa-sesion.js a propósito: quien abre el enlace no tiene sesión. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --fondo: #faf9f5; --tinta: #3E3F3F; --gris: #6F6867; --linea: #D8D4CE; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: var(--fondo); color: var(--tinta); font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
    main { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .marca { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--gris); }
    .punto { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--linea); border-top-color: var(--tinta); animation: girar 0.9s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .punto { animation-duration: 3s; } }
    p { font-size: 15px; line-height: 1.55; }
    a { color: var(--tinta); }
    button { font: inherit; font-size: 13px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--tinta); background: transparent; color: var(--tinta); cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <span class="marca">Spacio AM</span>
    <div class="punto" id="punto" aria-hidden="true"></div>
    <p id="msg" role="status">Abriendo tu enlace…</p>
    <button id="otra" type="button" hidden>Intentar de nuevo</button>
  </main>
  <script>
  (function () {
    // La misma API que usa la app: SA_PUBLIC_URL de sheets.js (Apps Script de Mi).
    var API_URL = "https://script.google.com/macros/s/AKfycbzqUTv_0NuNBVRXhlfHGaS5RdWKjBAmfA-dIsdDnMLbl2aE2PriEXNWw3qCi8yPF28qaQ/exec";
    var NO_ESTA = 'Este enlace ya no está disponible. Escríbenos a <a href="mailto:hola@spacioam.com">hola@spacioam.com</a>.';
    var msg = document.getElementById("msg"), punto = document.getElementById("punto"), otra = document.getElementById("otra");
    function fin(html, reintentar) { punto.hidden = true; msg.innerHTML = html; otra.hidden = !reintentar; }

    var m = /^\/([23456789abcdefghjkmnpqrstuvwxyz]{5})\/?$/i.exec(location.pathname || "");
    if (!m) { fin(NO_ESTA, false); return; }
    var codigo = m[1].toLowerCase();
    // Solo se abre un enlace de mi.spacioam.com o de Google Drive / Docs (igual que acepta el Apps Script).
    var seguro = /^https:\/\/(mi\.spacioam\.com|drive\.google\.com|docs\.google\.com)([\/?#]|$)/i;

    function abrir() {
      fin("Abriendo tu enlace…", false); punto.hidden = false;
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 20000);
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "enlace", codigo: codigo }), signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          clearTimeout(t);
          var url = j && j.ok && j.data && String(j.data.url || "");
          if (url && seguro.test(url)) location.replace(url);
          else fin(NO_ESTA, false);
        })
        .catch(function () {
          clearTimeout(t);
          fin("No pudimos abrir tu enlace. Revisa tu conexión e intenta de nuevo.", true);
        });
    }
    otra.addEventListener("click", abrir);
    abrir();
  })();
  </script>
</body>
</html>
